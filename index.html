<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Database Web App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    input, button { padding: 12px; margin-top: 8px; width: 100%; box-sizing: border-box; font-size: 16px; }
    button { background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0052a3; }
    ul { padding-left: 20px; }
    li { padding: 4px 0; }
  </style>
</head>
<body>

  <h2>Submit Data to Firebase</h2>
  <input type="text" id="userInput" placeholder="Type a message..." />
  <button id="saveBtn">Save to Database</button>

  <h3>Live Database Entries:</h3>
  <ul id="dataList"></ul>

  <!-- Firebase Web SDK v10 (CDN Modules) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 1. Replace with your actual Firebase config keys from Step 6:
    const firebaseConfig = {
      apiKey: "AIzaSyDeVG7OZ-F0wASmhkFr6xRN5nNKceWSSzk",
      authDomain: "my-website-db-ee1d5.firebaseapp.com",
      projectId: "my-website-db-ee1d5",
      storageBucket: "my-website-db-ee1d5.firebasestorage.app",
      messagingSenderId: "583708778503",
      appId: "1:583708778503:web:79f11419f19c488cea4aa2"
    };

    // 2. Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const messagesCol = collection(db, "messages");

    // 3. Write data on button click
    const saveBtn = document.getElementById("saveBtn");
    const userInput = document.getElementById("userInput");

    saveBtn.addEventListener("click", async () => {
      const text = userInput.value.trim();
      if (!text) return;

      try {
        await addDoc(messagesCol, {
          text: text,
          createdAt: new Date()
        });
        userInput.value = "";
      } catch (error) {
        console.error("Error writing document: ", error);
      }
    });

    // 4. Real-time listener: updates UI instantly when data changes
    const dataList = document.getElementById("dataList");
    onSnapshot(messagesCol, (snapshot) => {
      dataList.innerHTML = "";
      snapshot.forEach((doc) => {
        const li = document.createElement("li");
        li.textContent = doc.data().text;
        dataList.appendChild(li);
      });
    });
  </script>
</body>
</html>
